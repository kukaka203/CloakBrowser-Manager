services:
  cloak-manager:
    build:
      context: .
    ports:
      - "9088:8080"
    devices:
      - /dev/dri:/dev/dri   
    group_add:
      - "44"    # video
      - "993"   # render
    volumes:
      - ./cloak-data:/data
      - ./extensions:/data/extensions
      - ./backend:/app/backend
      - /app/backend/__pycache__
      - ./frontend/dist:/app/frontend/dist
 
    environment:
      TZ: Asia/Ho_Chi_Minh
      #UVICORN_RELOAD: "1"
    restart: unless-stopped

volumes:
  cloakprofiles:
